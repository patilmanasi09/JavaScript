<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reverse a Number</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 40px;
        }
        .container {
            border: 1px solid #ccc;
            padding: 20px;
            max-width: 350px;
            border-radius: 8px;
        }
        input, button {
            margin-top: 10px;
            padding: 8px;
            font-size: 16px;
        }
        button {
            cursor: pointer;
        }
        #result {
            font-weight: bold;
            margin-top: 15px;
            font-size: 16px;
            color: #2e7d32;
        }
    </style>
</head>
<body>

    <div class="container">
        <h3>Reverse a Number</h3>
        <label for="numInput">Enter a number:</label><br>
        <input type="number" id="numInput" placeholder="e.g., 12345">
        <button onclick="reverseNumber()">Reverse</button>

        <p id="result"></p>
    </div>

    <script>
        function reverseNumber() {
            let inputElement = document.getElementById("numInput");
            
            let number = parseInt(inputElement.value);
            let resultDisplay = document.getElementById("result");

            if (isNaN(number)) {
                resultDisplay.innerText = "Please enter a valid number.";
                resultDisplay.style.color = "#d32f2f";
                return;
            }

            let isNegative = number < 0;
            
            let num = Math.abs(number);
            let reversed = 0;

            while (num > 0) {
              
                let lastDigit = num % 10;
                
                reversed = (reversed * 10) + lastDigit;
                
                num = Math.floor(num / 10);
            }

            if (isNegative) {
                reversed = -reversed;
            }

            resultDisplay.innerText = "Reversed number: " + reversed;
            resultDisplay.style.color = "#2e7d32"; 
        }
    </script>

</body>
</html>
