<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Checker</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 40px;
        }
        .container {
            border: 1px solid #ccc;
            padding: 20px;
            max-width: 300px;
            border-radius: 8px;
        }
        input, button {
            margin-top: 10px;
            padding: 8px;
        }
        #result {
            font-weight: bold;
            color: #333;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h3>Number Checker</h3>
        <label for="numberInput">Enter a number:</label><br>
        <input type="number" id="numberInput">
        <button onclick="checkNumber()">Check</button>

        <p id="result"></p>
    </div>

    <script>
        function checkNumber() {
            let inputElement = document.getElementById("numberInput");
            let number = parseFloat(inputElement.value);

            let resultDisplay = document.getElementById("result");

            if (isNaN(number)) {
                resultDisplay.innerText = "Please enter a valid number.";
            } else if (number > 0) {
                resultDisplay.innerText = "The number is positive.";
            } else if (number < 0) {
                resultDisplay.innerText = "The number is negative.";
            } else {
                resultDisplay.innerText = "The number is zero.";
            }
        }
    </script>
</body>
</html>
