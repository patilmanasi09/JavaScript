<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Largest Number Finder</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 40px;
        }
        .container {
            border: 1px solid #ccc;
            padding: 20px;
            max-width: 350px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        input, button {
            padding: 8px;
            font-size: 16px;
        }
        button {
            cursor: pointer;
            margin-top: 10px;
        }
        #result {
            font-weight: bold;
            color: #2e7d32;
            margin-top: 15px;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h3>Find the Largest Number</h3>
        <label>Enter three numbers:</label>
        <input type="number" id="num1" placeholder="First number">
        <input type="number" id="num2" placeholder="Second number">
        <input type="number" id="num3" placeholder="Third number">
        
        <button onclick="findLargest()">Find Largest</button>

        <p id="result"></p>
    </div>

    <script>
        function findLargest() {
            
            let num1 = parseFloat(document.getElementById("num1").value);
            let num2 = parseFloat(document.getElementById("num2").value);
            let num3 = parseFloat(document.getElementById("num3").value);
            let resultDisplay = document.getElementById("result");

            if (isNaN(num1) || isNaN(num2) || isNaN(num3)) {
                resultDisplay.innerText = "Please enter valid numbers in all fields.";
                resultDisplay.style.color = "#d32f2f"; 
                return;
            }

            let largest;

            if (num1 >= num2 && num1 >= num3) {
                largest = num1;
            } else if (num2 >= num1 && num2 >= num3) {
                largest = num2;
            } else {
                largest = num3;
            }

            resultDisplay.innerText = "The largest number is " + largest + ".";
            resultDisplay.style.color = "#2e7d32"; 
        }
    </script>

</body>
</html>
