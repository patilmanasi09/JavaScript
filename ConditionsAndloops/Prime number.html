<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime Number Checker</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 40px;
        }
        .container {
            border: 1px solid #ccc;
            padding: 20px;
            max-width: 350px;
            border-radius: 8px;
        }
        input, button {
            margin-top: 10px;
            padding: 8px;
        }
        #result {
            font-weight: bold;
            margin-top: 15px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h3>Prime Number Checker</h3>
        <label for="numInput">Enter a number:</label><br>
        <input type="number" id="numInput">
        <button onclick="checkPrime()">Check</button>

        <p id="result"></p>
    </div>

    <script>
        function checkPrime() {
            let inputElement = document.getElementById("numInput");
            let number = parseInt(inputElement.value);
            let resultDisplay = document.getElementById("result");

            if (isNaN(number)) {
                resultDisplay.innerText = "Please enter a valid number.";
                resultDisplay.style.color = "black";
                return;
            }

            if (number <= 1) {
                resultDisplay.innerText = number + " is not a prime number.";
                resultDisplay.style.color = "#d32f2f"; 
                return;
            }

            let isPrime = true;

            for (let i = 2; i < number; i++) {
                
                if (number % i === 0) {
                    isPrime = false; 
                    break; 
                }
            }

            if (isPrime) {
                resultDisplay.innerText = number + " is a prime number.";
                resultDisplay.style.color = "#2e7d32"; 
            } else {
                resultDisplay.innerText = number + " is not a prime number.";
                resultDisplay.style.color = "#d32f2f"; 
            }
        }
    </script>

</body>
</html>
