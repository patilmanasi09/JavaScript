<!doctype html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <title>Array assignments</title>
</head>

<body>
   
<!-- Assignment 5 -->
 <section>
      <div class="container w-75 rounded m-5 p-3 bg-secondary-subtle">
        <h2>Assignment 5 - Sort names Alphabetically</h2>

        <div class="mb-3">
          <input type="text" id="inputNames" placeholder="Enter a name" />

          <button class="btn btn-primary" onclick="addName()">
            Add Name
          </button>
          <button class="btn btn-primary" onclick="sortNames()">
            Sort
          </button>
          <button class="btn btn-primary" onclick="resetNames()">Reset</button>

        <div class="container" id="SortArray"></div>


        </div>

        
      </div>
    </section>

    <script>
    namesArr = []

    function addName(){
        let inputNamesEle = document.querySelector('#inputNames')
        let inNames = inputNamesEle.value
        namesArr.push(inNames)
        inputNamesEle.value=""
        console.log(namesArr)
    }

    function sortNames(){
        let sortedNames = namesArr.sort(function(a,b){
            return a.toLowerCase().localeCompare(b.toLowerCase());
        })

        document.querySelector('#SortArray').innerHTML = sortedNames;
    }

    function resetNames(){
        namesArr=[]
        document.querySelector('#SortArray').innerHTML=""
        document.querySelector('#inputNames').value=""
    }
</script>

    <!-- Option 1: Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>

</body>
</html>
