<head>

    <title>Array assignments</title>

<body>
    <section>
        <div class="container w-75 rounded m-5 p-3" style="background-color: rgb(223, 223, 223); height: 300px;">
            <h2>Assignment 3 . Search in food</h2>
            <div class="container">
                <p>Guess the ingredient of Panner Tikka Masala</p>
                <input type="text" id="inputFood" />
                <button class="btn btn-primary" onclick="SearchFood()">Search</button>
            </div>
            <div class="container" id="resultFood"></div>
        </div>
    </section>

    <script>
        FoodArray = ['Paneer', 'Paneer masala', 'Tomato', 'Capsicum', 'Onion', 'Curd', 'Ginger-garlic paste', 'oil/ butter', 'salt', 'Coriander', 'Red chili powder', 'Garam masala']
     function SearchFood(){
        inputFoodElmt = document.querySelector('#inputFood')
        ingredient = inputFoodElmt.value

        // for (i = 0; i < FoodArray.length; i++) {
        //     console.log(FoodArray[i])
        //     if (FoodArray[i].toLowerCase() == ingredient.toLowerCase()) {
        //         document.querySelector('#resultFood').innerHTML = FoodArray[i]
        //         break;
        //     } else {
        //         document.querySelector('#resultFood').innerHTML = 'Not Found'
        //     }
        // }

        ingFromArray = FoodArray.find((ing) => ing.toLowerCase() == ingredient.toLowerCase())
        console.log(ingFromArray)
        if (ingFromArray) {
            document.querySelector('#resultFood').innerHTML = ingFromArray
        } else {
            document.querySelector('#resultFood').innerHTML = 'Not Found'
        }

     }
    </script>

</body>
