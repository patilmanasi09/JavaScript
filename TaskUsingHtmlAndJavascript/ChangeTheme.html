<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Theme</title>
</head>

<body>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
            background: white;
            color: black;
        }

        .dark {
            background: black;
            color: white;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
        }

        h1 {
            font-size: 40px;
        }
    </style>
    </head>

    <body>

        <h2>Change Theme (Dark / Light Mode)</h2>

        <button onclick="toggleTheme()">Change Theme</button>

        <hr>

        <!-- <h2>4. Counter with Buttons</h2>

        <h1 id="count">0</h1>

        <button onclick="increase()">+1</button>
        <button onclick="decrease()">-1</button>
        <button onclick="reset()">Reset</button> -->


        <script>

           

            function toggleTheme() {
                document.body.classList.toggle("dark");
            }


          

            let count = localStorage.getItem("counter");

            if (count === null) {
                count = 0;
            } else {
                count = Number(count);
            }

            document.getElementById("count").innerText = count;


            function increase() {
                count++;
                update();
            }

            function decrease() {
                count--;
                update();
            }

            function reset() {
                count = 0;
                update();
            }

            function update() {
                document.getElementById("count").innerText = count;
                localStorage.setItem("counter", count);
            }

        </script>


    </body>

</html>
