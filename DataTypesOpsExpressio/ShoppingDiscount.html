<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Discount</title>
</head>
<body>

<p>Total Amount: <span id="total"></span></p>
<p>Discounted Total: <span id="discounted"></span></p>

<script>

let total = prompt("Enter total amount:")

total = Number(total)

let discountedTotal = total

if (total > 100) {
    discountedTotal -= total * 0.10
}

document.getElementById("total").textContent = total
document.getElementById("discounted").textContent = discountedTotal

console.log("Total Amount:", total)
console.log("Discounted Total:", discountedTotal)

</script>

</body>
</html>
