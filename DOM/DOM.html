<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
  <div class="d-flex" style="gap:50px; margin-left: 450px;">
    <div class="card shadow" style="width: 20rem; border-radius:15px; overflow:hidden; margin-top: 30px;">

      <img id="productImage1" src="./assets/ip15O.webp" class="card-img-top h-50" alt="">

      <div class="card-body text-white" style="background-color:#4cd964;">

        <span class="badge bg-danger mb-2">PHONE</span>

        <h4 class="fw-bold">iPhone 17 Pro</h4>

        <p class="mb-1"><i class="fa-solid fa-mobile-screen"></i> Display: Smooth</p>
        <p class="mb-1"><i class="fa-solid fa-microchip"></i> Chip: A17 Pro</p>
        <p class="mb-1"><i class="fa-solid fa-camera"></i> Camera: 48MP</p>

        <p class="mt-3 mb-1">Pick a color:</p>


        <div class="d-flex gap-2 mb-3">

          <span class="rounded-circle color-dot" data-color="navy"
            style="width:15px;height:15px;background:navy; cursor:pointer;"></span>

          <span class="rounded-circle color-dot" data-color="orange"
            style="width:15px;height:15px;background:orangered; cursor:pointer;"></span>

          <span class="rounded-circle color-dot" data-color="gray"
            style="width:15px;height:15px;background:gray; cursor:pointer;"></span>
        </div>

        <h5>₹134,450 <small class="text-decoration-line-through text-light opacity-75">₹140,500</small></h5>


        <a href="#" class="btn btn-danger w-100 d-flex align-items-center justify-content-center gap-2 mt-2">
          <i class="fa-solid fa-cart-shopping"></i>Add to Cart</a>

      </div>
    </div>

    <div class="card shadow" style="width: 20rem; border-radius:15px; overflow:hidden; margin-top: 30px;">

      <img id="productImage2" src="./assets/ip17P.jpg" class="card-img-top h-50" alt="">

      <div class="card-body text-white " style="background-color:#4cd964; height: 40px;">

        <span class="badge bg-dark mb-2">PHONE</span>

        <h4 class="fw-bold">iPhone 17</h4>

        <p class="mb-1"><i class="fa-solid fa-mobile-screen"></i> Display: Smooth</p>
        <p class="mb-1"><i class="fa-solid fa-microchip"></i> Chip: A19 Pro</p>
        <p class="mb-1"><i class="fa-solid fa-camera"></i> Camera: 48MP</p>

        <p class="mt-3 mb-1">Pick a color:</p>

        <div class="d-flex gap-2 mb-3">

          <span class="rounded-circle color-dot" data-color="blue"
            style="width:15px;height:15px;background:blue; cursor:pointer;"></span>

          <span class="rounded-circle color-dot" data-color="purple"
            style="width:15px;height:15px;background:purple; cursor:pointer;"></span>

          <span class="rounded-circle color-dot" data-color="green"
            style="width:15px;height:15px;background:green; cursor:pointer;"></span>
        </div>

        <h5>₹80,000 <small class="text-decoration-line-through text-light opacity-75">₹85,500</small></h5>

        <a href="#" class="btn btn-dark w-100 d-flex align-items-center justify-content-center gap-2 mt-2">
          <i class="fa-solid fa-cart-shopping"></i>Add to Cart</a>

      </div>
    </div>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
