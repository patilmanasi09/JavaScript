<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login PAge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="bg-primary">


    <div class="container mt-5">
         <div class="row align-items-center justify-content-center">

        <!-- Image Section -->
        <div class="col-12 col-md-6 text-center mb-4 mb-md-0">
            <img src="./assets/login.jpg" class="img-fluid rounded w-100 h-100" alt="Login Image"  >
        </div>
            <div class="col-12 col-md-6 p-3 bg-light rounded mt-2">
                <!-- <form> -->
                    <div class="mb-3">
                        <label for="InputEmail1" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="InputEmail1" aria-describedby="emailHelp">
                        <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
                    </div>
                    <div class="mb-3">
                        <label for="InputPassword1" class="form-label">Password</label>
                        <input type="password" class="form-control" id="InputPassword1">
                    </div>
                    <button class="btn btn-primary" onclick="login()">Login</button>
                <!-- </form> -->
            </div>
        </div>
    </div>

<script>

    // e = 'bhim@gmail.com'
    // p = 'kalia123'
emailElement = document.querySelector('#InputEmail1')
passwordElement = document.querySelector('#InputPassword1')

function login(){
    emailValue = emailElement.value
    passwordValue = passwordElement.value 

    // localStorage user data
    let storedUser = JSON.parse(localStorage.getItem("user"))

    if(emailValue.trim().length > 0){

        if(storedUser){ 
            if(emailValue === storedUser.email){

                if(passwordValue === storedUser.password){
                    window.location.href = './home.html'
                }else{
                    alert("Invalid Password")
                }

            }else{
                alert("Email not registered")
            }

        }else{
            alert("No user found, please register first")
        }

    }else{
        alert("Please Enter email address")
    }
}
</script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
